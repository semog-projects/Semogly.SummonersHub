# Build e testes da API e do front a cada PR (inclusive os empilhados sobre branches de feature)
# e a cada push na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET (versão do global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Semogly.SummonersHub.slnx

      - name: Build
        run: dotnet build Semogly.SummonersHub.slnx --no-restore --configuration Release

      # Unitários, de arquitetura e de integração (PostgreSQL via Testcontainers, usando o Docker do runner)
      - name: Test
        run: dotnet test --solution Semogly.SummonersHub.slnx --no-build --configuration Release

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      # tsc -b + vite build: também valida os tipos
      - name: Build
        run: npm run build
